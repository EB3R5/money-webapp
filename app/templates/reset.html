<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New password · Money</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png" />
  <link rel="stylesheet" href="/static/css/app.css?v={{ css_v() }}" />
</head>
<body>
  <main class="login">
    <form class="login-card" method="post" action="{{ action }}">
      <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}" />
      <h1>Money</h1>
      <p class="muted">Choose a new password for <strong>{{ username }}</strong>. Every other session of this account is signed out.</p>
      {% for e in errors %}<p class="login-error" role="alert">{{ e }}</p>{% endfor %}
      <label>New password
        <input id="password1" name="password1" type="password" autocomplete="new-password" minlength="12" autofocus required />
      </label>
      <label>New password, again
        <input id="password2" name="password2" type="password" autocomplete="new-password" minlength="12" required />
      </label>
      <p class="muted">At least twelve characters; not a common password; not your username.</p>
      <button type="submit">Set the password</button>
    </form>
  </main>
</body>
</html>
