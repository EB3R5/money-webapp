<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Money</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png" />
  <link rel="stylesheet" href="/static/css/app.css?v={{ css_v() }}" />
</head>
<body>
  <main class="login">
    <form class="login-card" method="post" action="/login">
      <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}" />
      <img class="login-mark" src="/static/img/mark.png" alt="" width="44" height="44" />
      <h1>Money</h1>
      {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
      <label>Username
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required />
      </label>
      <label>Password
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      {% if next %}<input type="hidden" name="next" value="{{ next }}" />{% endif %}
      <label class="login-remember"><input type="checkbox" name="remember" value="1" /> Remember me for thirty days</label>
      <button type="submit">Sign in</button>
      <p class="muted login-help">Forgot your password? Ask your admin for a reset link.</p>
    </form>
  </main>
</body>
</html>
