{% extends "base.html" %}
{% block title %}Inventory — Columns — Money{% endblock %}

{% block content %}
<div class="page-head">
  <h1>Inventory — Columns</h1>
  <span class="muted" id="ic-summary"></span>
  <input type="search" id="ic-q" class="card-search" placeholder="Search items…" value="{{ q }}" autocomplete="off" aria-label="Search items" />
  <a class="ml-auto btn-secondary" href="/inventory">🃏 Card view</a>
</div>

<div class="ic-finder" id="ic-finder">
  <div class="ic-col" id="ic-col-group" data-level="group"></div>
  <div class="ic-col" id="ic-col-category" data-level="category"></div>
  <div class="ic-col" id="ic-col-subcategory" data-level="subcategory"></div>
  <div class="ic-col" id="ic-col-item" data-level="item"></div>
  <div class="ic-detail" id="ic-detail"><div class="ic-empty">Select an item.</div></div>
</div>

<style nonce="{{ csp_nonce }}">
  .ic-finder { display: grid; grid-template-columns: repeat(4, minmax(140px, 1fr)) 1.4fr;
    height: calc(100vh - 150px); border: 1px solid var(--rule); border-radius: var(--radius);
    overflow: hidden; background: #fff; }
  .ic-col { border-right: 1px solid var(--rule-soft); overflow-y: auto; }
  .ic-row { display: flex; justify-content: space-between; align-items: center; gap: 6px;
    padding: 6px 10px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--rule-soft); }
  .ic-row:hover { background: var(--paper); }
  .ic-row.active { background: var(--rule-blue); color: #fff; }
  .ic-row.active .ic-meta { color: var(--rule-blue-tint); }
  .ic-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ic-meta { color: var(--graphite); font-size: 11px; white-space: nowrap; }
  .ic-chevron { color: var(--rule); font-size: 11px; }
  .ic-row.active .ic-chevron { color: #fff; }
  .ic-detail { padding: 14px 16px; overflow-y: auto; }
  .ic-detail h3 { margin: 0 0 4px; font-size: 16px; }
  .ic-detail .ic-detail-val { font-variant-numeric: tabular-nums; color: var(--bank-green); font-weight: 600; margin-bottom: 12px;
    display: flex; align-items: center; gap: 12px; }
  .ic-detail .ic-sheet { font-weight: 400; color: inherit; text-decoration: none; margin-left: auto; }
  .ic-imgs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .ic-img { width: 100%; max-width: 320px; border-radius: var(--radius); border: 1px solid var(--rule-soft); object-fit: cover; }
  .ic-detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
  .ic-detail dt { color: var(--graphite); font-size: 12px; }
  .ic-detail dd { margin: 0; font-size: 13px; word-break: break-word; }
  .ic-empty { color: var(--graphite); font-size: 13px; padding: 16px; }
</style>
<script src="/static/js/inventory-columns.js?v={{ css_v('js/inventory-columns.js') }}"></script>
{% endblock %}
