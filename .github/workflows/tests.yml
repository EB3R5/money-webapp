# Runs the suite on every pull request into main and on every push to it. No secrets: the
# tests use a temporary data directory per test (tests/conftest.py store_db) and never reach
# the Bridge.
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q -p no:cacheprovider
        env:
          SESSION_SECRET: ci-only-not-a-real-secret
